<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerAI - AI 求职助手</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{colors:{brand:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8'},accent:{50:'#fff7ed',100:'#ffedd5',200:'#fed7aa',300:'#fdba74',400:'#fb923c',500:'#f97316'}},animation:{'fade-in':'fadeIn .3s ease-out','slide-up':'slideUp .4s ease-out','pulse-dot':'pulseDot 1.4s infinite ease-in-out'},keyframes:{fadeIn:{'0%':{opacity:'0'},'100%':{opacity:'1'}},slideUp:{'0%':{opacity:'0',transform:'translateY(16px)'},'100%':{opacity:'1',transform:'translateY(0)'}},pulseDot:{'0%,80%,100%':{opacity:'0',transform:'scale(0.6)'},'40%':{opacity:'1',transform:'scale(1)'}}}}}}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f8fafc}
.scrollbar::-webkit-scrollbar{width:5px}
.scrollbar::-webkit-scrollbar-track{background:transparent}
.scrollbar::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}
.dot{width:8px;height:8px;border-radius:50%;background:#3b82f6;display:inline-block;margin:0 2px}
.dot:nth-child(1){animation:pulseDot 1.4s infinite ease-in-out}
.dot:nth-child(2){animation:pulseDot 1.4s .2s infinite ease-in-out}
.dot:nth-child(3){animation:pulseDot 1.4s .4s infinite ease-in-out}
.md h1{font-size:1.4rem;font-weight:700;margin:.8rem 0 .4rem;color:#1e293b}
.md h2{font-size:1.15rem;font-weight:700;margin:.6rem 0 .4rem;color:#1e293b}
.md h3{font-size:1.05rem;font-weight:600;margin:.4rem 0 .2rem;color:#334155}
.md ul,.md ol{padding-left:1.5rem;margin:.4rem 0}
.md li{margin:.2rem 0;color:#475569;line-height:1.7}
.md p{margin:.4rem 0;color:#475569;line-height:1.7}
.md strong{color:#1e293b;font-weight:600}
.md table{width:100%;border-collapse:collapse;margin:.6rem 0;font-size:.85rem}
.md th{background:#f1f5f9;padding:.4rem .6rem;text-align:left;font-weight:600;color:#1e293b;border-bottom:2px solid #e2e8f0}
.md td{padding:.4rem .6rem;border-bottom:1px solid #f1f5f9;color:#475569}
.md code{background:#f1f5f9;padding:.1rem .35rem;border-radius:4px;font-size:.85em;color:#e11d48}
.md blockquote{border-left:3px solid #93c5fd;padding-left:.75rem;margin:.4rem 0;color:#64748b;font-style:italic;font-size:.9rem}
.md hr{margin:.6rem 0;border:none;border-top:1px solid #e2e8f0}
.tag-h{display:inline-block;padding:.1rem .5rem;border-radius:12px;font-size:.75rem;font-weight:600;margin-right:.2rem;background:#fef2f2;color:#dc2626}
.tag-m{display:inline-block;padding:.1rem .5rem;border-radius:12px;font-size:.75rem;font-weight:600;margin-right:.2rem;background:#fffbeb;color:#d97706}
.tag-l{display:inline-block;padding:.1rem .5rem;border-radius:12px;font-size:.75rem;font-weight:600;margin-right:.2rem;background:#f0fdf4;color:#16a34a}
.citem{transition:all .3s}
.citem:hover{transform:translateX(4px)}
</style>
</head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="app.js"></script>
</body>
</html>
